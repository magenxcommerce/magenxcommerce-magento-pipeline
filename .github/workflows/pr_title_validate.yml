name: PR title check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  title:
    name: PR title validation
    if: "${{ !(startsWith(github.head_ref, 'release-please') && contains(github.event.pull_request.labels.*.name, 'autorelease: pending')) }}"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      # wip: true sets a commit status on the PR head
      statuses: write
    steps:
      # no checkout: pull_request_target must never run PR code
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # keep in sync with .github/release/*config.json changelog-sections
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.
          wip: true
          validateSingleCommit: false
          ignoreLabels: |
            dependencies
            github_actions
