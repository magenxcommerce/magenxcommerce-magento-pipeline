name: Pre-release and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

permissions: {}

env:
  PRERELEASE_CONFIG: ".github/release/prerelease-config.json"
  PRERELEASE_MANIFEST: ".github/release/prerelease-manifest.json"
  RELEASE_CONFIG: ".github/release/config.json"
  RELEASE_MANIFEST: ".github/release/manifest.json"

concurrency:
  group: release

jobs:
  pre-release:
    name: Pre-release PR and tag
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.pre-release.outputs.releases_created }}
      tag_name: ${{ steps.pre-release.outputs.tag_name }}
    steps:
      # Releases made with GITHUB_TOKEN do not trigger build.yml, so a GitHub App
      # token (preferred) or MAGENX_CI_GITHUB_TOKEN PAT is required.
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.CI_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Release-please pre-release
        id: pre-release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.MAGENX_CI_GITHUB_TOKEN }}
          config-file: ${{ env.PRERELEASE_CONFIG }}
          manifest-file: ${{ env.PRERELEASE_MANIFEST }}

  release:
    name: Release PR and tag
    needs: pre-release
    # release PR is opened/updated only after a pre-release tag was published
    if: ${{ needs.pre-release.outputs.releases_created == 'true' && contains(needs.pre-release.outputs.tag_name, vars.PRERELEASE_TYPE || 'alpha') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.CI_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Release-please release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.MAGENX_CI_GITHUB_TOKEN }}
          config-file: ${{ env.RELEASE_CONFIG }}
          manifest-file: ${{ env.RELEASE_MANIFEST }}
