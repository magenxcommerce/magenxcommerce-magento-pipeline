name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or production)"
        required: true
        type: string
      tag_name:
        description: "Release tag holding the artifact"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      tag_name:
        description: "Release tag holding the artifact (redeploy)"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment }}
  TAG_NAME: ${{ inputs.tag_name }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      issues: write
      pull-requests: write
      # push and tag the release in the OCI registry (vars.OCI_REPOSITORY)
      packages: write
    # configure required reviewers on the production environment
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Validate inputs
        env:
          OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
        run: |
          case "${DEPLOY_ENV}" in staging|production) ;; *) echo "::error::Unknown environment ${DEPLOY_ENV}"; exit 1 ;; esac
          [ -n "${OCI_REPOSITORY}" ] || { echo "::error::set variable OCI_REPOSITORY (e.g. ghcr.io/acme/magento-release), see README"; exit 1; }
          [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid tag ${TAG_NAME}"; exit 1; }

      - name: Download and verify release artifact
        id: artifact-download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" -D dist \
            --pattern 'release_*.tar.gz' --pattern 'release_*.tar.gz.sha256'
          cd dist
          sha256sum -c ./*.sha256
          asset="$(basename ./*.tar.gz)"
          gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(cut -d' ' -f1 "${asset}.sha256")" >> "${GITHUB_OUTPUT}"

      # magenx-deputy-go deploy.source oci: the archive as the only layer of <OCI_REPOSITORY>:<tag>, signed.
      # The same bytes in every environment: staging pushes the pre-release tag, production the release tag.
      - name: Push release to OCI registry
        id: oci-push
        uses: ./.github/actions/oci-release
        with:
          repository: ${{ vars.OCI_REPOSITORY }}
          tag: ${{ inputs.tag_name }}
          archive: dist/${{ steps.artifact-download.outputs.asset }}
          sha256: ${{ steps.artifact-download.outputs.sha256 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

      # magenx-deputy-go pulls <OCI_REPOSITORY>:<tag> and checks it against artifact_digest and the signature
      - name: Trigger signed deployment webhook
        id: deployment-webhook
        env:
          SHA256: ${{ steps.artifact-download.outputs.sha256 }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          SIGNATURE_HMAC_KEY: ${{ secrets.SIGNATURE_HMAC_KEY }}
          # keep above deputy deployment_timeout_seconds (default 900)
          WEBHOOK_TIMEOUT: ${{ vars.DEPLOY_WEBHOOK_TIMEOUT || '960' }}
        run: |
          timestamp="$(date -u +%s)"
          # deploy.source oci: deputy names the release dir after the tag
          jq -cn \
            --arg environment "${DEPLOY_ENV}" \
            --arg tag_name "${TAG_NAME}" \
            --arg artifact_digest "sha256:${SHA256}" \
            --argjson timestamp "${timestamp}" \
            '{environment: $environment, tag_name: $tag_name, tag: $tag_name, artifact_digest: $artifact_digest, timestamp: $timestamp}' \
            | tr -d '\n' > payload.json
          signature="$(openssl dgst -sha256 -hmac "${SIGNATURE_HMAC_KEY}" -r < payload.json | cut -d' ' -f1)"
          headers=(-H "Content-Type: application/json" -H "X-Signature: sha256=${signature}" -H "X-Timestamp: ${timestamp}")
          # magenx-deputy-go requires both shared secret and HMAC signature
          [ -n "${DEPLOY_WEBHOOK_SECRET}" ] && headers+=(-H "X-Webhook-Secret: ${DEPLOY_WEBHOOK_SECRET}")
          # magenx-deputy-go deploys synchronously: response comes after deploy + health check.
          # No retries: a retry would start a second deployment.
          curl -sS --fail-with-body --max-time "${WEBHOOK_TIMEOUT}" \
            -X POST "${headers[@]}" --data-binary @payload.json "${DEPLOY_WEBHOOK_URL}"

      # the moving tag new servers bootstrap from: magenx-deputy-go bootstrap -tag <environment>
      - name: Move environment tag
        id: oci-tag
        env:
          OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
        run: crane tag "${OCI_REPOSITORY}:${TAG_NAME}" "${DEPLOY_ENV}"

      - name: Deployment status message
        id: deployment-status-comment
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          DOWNLOAD: ${{ steps.artifact-download.outcome }}
          OCI_PUSH: ${{ steps.oci-push.outcome }}
          WEBHOOK: ${{ steps.deployment-webhook.outcome }}
          OCI_TAG: ${{ steps.oci-tag.outcome }}
          ASSET: ${{ steps.artifact-download.outputs.asset }}
          OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
          MANIFEST: ${{ steps.oci-push.outputs.manifest-digest }}
        run: |
          declare -A step_icons=( ["success"]="✔️" ["failure"]="❌" ["skipped"]="➖" ["cancelled"]="✖️" [""]="➖" )
          row() { echo "${step_icons[$2]} $1: ${2:-skipped}"; }
          {
            echo "## ⚠️ ${DEPLOY_ENV} release ${TAG_NAME} deployment status: ${JOB_STATUS}"
            row "Download and verify artifact (sha256, attestation)" "${DOWNLOAD}"
            row "Push and sign release in OCI registry" "${OCI_PUSH}"
            row "Deployment event webhook trigger" "${WEBHOOK}"
            row "Move ${DEPLOY_ENV} tag" "${OCI_TAG}"
            echo
            echo "- **ARTIFACT**: \`${ASSET}\`"
            if [ -n "${MANIFEST}" ]; then
              echo "- **IMAGE**: \`${OCI_REPOSITORY}:${TAG_NAME}\` (\`${MANIFEST}\`)"
            fi
            echo "- **RUN**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- **DATE**: $(date -u +%Y-%m-%d-%H:%M) UTC"
          } > "${RUNNER_TEMP}/deployment.md"
          cat "${RUNNER_TEMP}/deployment.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Add deployment status to release PR
        if: ${{ inputs.environment == 'staging' && !cancelled() }}
        uses: ./.github/actions/release-pr-comment
        with:
          body-file: ${{ runner.temp }}/deployment.md
          prerelease-type: ${{ vars.PRERELEASE_TYPE || 'alpha' }}

      - name: Production deployment issue
        if: ${{ inputs.environment == 'production' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ASSET: ${{ steps.artifact-download.outputs.asset }}
          ASSIGNEE: ${{ vars.DEPLOY_ISSUE_ASSIGNEE }}
        run: |
          title="Production release deployment status"
          gh issue list --repo "${GITHUB_REPOSITORY}" --label "release" --state open \
            --search "${title} in:title" --json number,title \
            --jq ".[] | select(.title | startswith(\"${title}\")) | .number" \
          | while read -r issue; do
              gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" --reason "not planned" \
                --comment "new deployment [${ASSET}]"
            done
          gh label create "deployment: ${JOB_STATUS}" --repo "${GITHUB_REPOSITORY}" --force > /dev/null
          gh label create "release" --repo "${GITHUB_REPOSITORY}" --force > /dev/null
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "${title} ${TAG_NAME} [${JOB_STATUS}]" \
            --body-file "${RUNNER_TEMP}/deployment.md" \
            --label "deployment: ${JOB_STATUS}" \
            --label "release" \
            ${ASSIGNEE:+--assignee "${ASSIGNEE}"}
